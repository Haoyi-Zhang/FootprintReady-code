name: Finite scientific checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check archived certificates and reproduce the finite campaigns
        shell: bash
        run: |
          mkdir scientific-output
          ulimit -v 2097152
          ulimit -t 300
          timeout --signal=TERM --kill-after=10s 300s bash -euo pipefail -c '
            python -B verify.py
            python -B reproduce.py --out scientific-output/reproduction
          ' >scientific-output/campaign.log 2>&1
      - name: Upload raw outputs even on a failed check
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finite-scientific-output
          path: scientific-output/
          if-no-files-found: warn
          retention-days: 14
